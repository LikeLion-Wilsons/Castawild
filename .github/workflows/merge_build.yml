name: Merge network commits to build

on:
  push:
    branches: [main]

jobs:
  merge-network-to-build:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[network]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Checkout build branch
        run: git checkout build

      - name: Merge main into build
        run: |
          git merge origin/main --no-ff --commit -m "Merge main into build triggered by [network] commit"

      - name: Push changes to build branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin build
